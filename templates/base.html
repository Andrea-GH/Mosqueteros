<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso al Sistema - Dashboard</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f4f8; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-box { 
            background: white; 
            border-radius: 12px; 
            padding: 40px; 
            width: 450px; /* Recuadro más ancho */
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            border-top: 5px solid #1e3a8a; /* Línea azul profesional arriba */
        }
        .btn-principal { 
            background-color: #1e3a8a; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            width: 100%; 
            padding: 14px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 16px;
            margin-top: 10px;
        }
        .btn-principal:hover { background-color: #152a61; }
        input { 
            width: 100%; 
            padding: 15px; /* Campos más grandes y cómodos */
            margin: 10px 0 20px 0; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            box-sizing: border-box;
            font-size: 16px;
        }
        label {
            color: #334155;
            font-weight: 600;
            font-size: 14px;
        }
        .logo-placeholder {
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
