<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categorías</title>
</head>
<body>
    <h1>Listado de Categorías</h1>

    <ul>
        {% for categoria in categorias %}
            <li>{{ categoria.nombre }} - Activa: {{ categoria.activo }}</li>
        {% empty %}
            <li>No hay categorías registradas.</li>
        {% endfor %}
    </ul>

    <a href="/">Volver al inicio</a>
</body>
</html>
