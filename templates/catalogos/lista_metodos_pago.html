<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Métodos de Pago</title>
</head>
<body>
    <h1>Listado de Métodos de Pago</h1>

    <ul>
        {% for metodo in metodos %}
            <li>{{ metodo.nombre }}</li>
        {% empty %}
            <li>No hay métodos de pago registrados.</li>
        {% endfor %}
    </ul>

    <a href="/">Volver al inicio</a>
</body>
</html>
