<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
</head>
<body>
    <h1>Listado de Clientes</h1>

    <ul>
        {% for cliente in clientes %}
            <li>{{ cliente.nombre }} - {{ cliente.correo }} - {{ cliente.telefono }}</li>
        {% empty %}
            <li>No hay clientes registrados.</li>
        {% endfor %}
    </ul>

    <a href="/">Volver al inicio</a>
</body>
</html>
